on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Cargo Cache
        id: cargo-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Test
        run: cargo test

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            bash bzip2 clang cmake cpio curl gcc-aarch64-linux-gnu git gzip \
            libbz2-dev liblzma-dev libssl-dev libxml2-dev lld llvm make \
            patch python3 sed tar xz-utils zlib1g-dev zstd
          rustup target add \
            aarch64-apple-darwin \
            aarch64-unknown-linux-gnu \
            x86_64-unknown-linux-gnu \
            x86_64-pc-windows-msvc
          rustup component add llvm-tools

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::707241054938:role/dependaconf-build
          aws-region: eu-west-1
          role-session-name: dependaconf-${{ github.run_id }}

      - name: Download macOS SDK
        run: |
          aws s3 cp \
            s3://dependaconf-public/osxcross/toolchains/osxcross-27d21e4977c9751d01199c7a226a6faf494c3dd9-MacOSX26-arm64-stable.tar.zst \
            ./osxcross-MacOSX26-arm64-stable.tar.zst \
            --only-show-errors
          tar -xf ./osxcross-MacOSX26-arm64-stable.tar.zst

      - name: Get MacOS Linker
        run: |
          cd dependabot-osxcross

          linker="$(find "$PWD/target/bin" -maxdepth 1 \
            -name 'arm64-apple-darwin*-clang' -print -quit)"
          if [[ -z "$linker" ]]; then
            echo "Could not find the osxcross ARM64 Darwin clang wrapper."
            exit 1
          fi
          echo "CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER=$linker" >> "$GITHUB_ENV"

      - name: Install cargo-xwin
        run: cargo install --locked --version 0.23.1 cargo-xwin

      - name: Build all targets
        shell: bash
        run: |
          set +e

          CARGO_BUILD_JOBS=1 cargo build --release --target x86_64-unknown-linux-gnu \
            > "$RUNNER_TEMP/build-x86_64-linux.log" 2>&1 &
          x86_linux_pid=$!

          CARGO_BUILD_JOBS=1 \
            CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc \
            cargo build --release --target aarch64-unknown-linux-gnu \
            > "$RUNNER_TEMP/build-aarch64-linux.log" 2>&1 &
          aarch64_linux_pid=$!

          CARGO_BUILD_JOBS=1 cargo build --release --target aarch64-apple-darwin \
            > "$RUNNER_TEMP/build-aarch64-macos.log" 2>&1 &
          aarch64_macos_pid=$!

          CARGO_BUILD_JOBS=1 cargo xwin build --release --target x86_64-pc-windows-msvc \
            > "$RUNNER_TEMP/build-x86_64-windows.log" 2>&1 &
          windows_pid=$!

          wait "$x86_linux_pid"; x86_linux_status=$?
          wait "$aarch64_linux_pid"; aarch64_linux_status=$?
          wait "$aarch64_macos_pid"; aarch64_macos_status=$?
          wait "$windows_pid"; windows_status=$?

          cat "$RUNNER_TEMP/build-x86_64-linux.log"
          cat "$RUNNER_TEMP/build-aarch64-linux.log"
          cat "$RUNNER_TEMP/build-aarch64-macos.log"
          cat "$RUNNER_TEMP/build-x86_64-windows.log"

          if (( x86_linux_status || aarch64_linux_status || aarch64_macos_status || windows_status )); then
            echo "One or more target builds failed (x86_64 Linux=$x86_linux_status, AArch64 Linux=$aarch64_linux_status, AArch64 macOS=$aarch64_macos_status, Windows MSVC=$windows_status)."
            exit 1
          fi

      - name: Stage release binaries
        run: |
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/dependaconf \
            dist/dependaconf-aarch64-apple-darwin
          cp target/aarch64-unknown-linux-gnu/release/dependaconf \
            dist/dependaconf-aarch64-unknown-linux-gnu
          cp target/x86_64-unknown-linux-gnu/release/dependaconf \
            dist/dependaconf-x86_64-unknown-linux-gnu
          cp target/x86_64-pc-windows-msvc/release/dependaconf.exe \
            dist/dependaconf-x86_64-pc-windows-msvc.exe

      - name: Upload release binaries
        uses: actions/upload-artifact@v7
        with:
          name: dependaconf-binaries
          path: dist/
          if-no-files-found: error

  release:
    runs-on: ubuntu-slim
    needs:
      - build

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          name: dependaconf-binaries
          path: dist/

      - name: Create Tag
        id: release-version
        run: |
          latest=$(git tag --list '*.*.*.*' --sort=-v:refname | head -n1)
          today=$(date -u +%Y.%m.%d)

          if [[ $latest == "$today."* ]]; then
              version="${today}.$(( ${latest##*.} + 1 ))"
          else
              version="$today.1"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          gh release create "$VERSION" dist/* \
              --repo="$GITHUB_REPOSITORY" \
              --title="${GITHUB_REPOSITORY#*/} $VERSION" \
              --generate-notes

