version: 2
updates:
- package-ecosystem: npm
  directory: /
  schedule:
    interval: weekly
  groups:
    react:
      patterns:
      - '@types/react'
      - react
    react-dom:
      patterns:
      - '@types/react-dom'
      - react-dom
  cooldown:
    semver-major-days: 30
    semver-minor-days: 7
    semver-patch-days: 3
